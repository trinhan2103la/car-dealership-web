name: ci

# Ngày 19 (ADR-011): CI riêng cho repo web (pnpm monorepo).
# Hiện web mới có khung; apps/public-web (Ngày 113+) và apps/admin-portal (Ngày 140+)
# chưa tồn tại, nên bước build/test/lint 2 frontend bật dần khi có app.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Bật khi có app frontend (có script tương ứng ở root monorepo).
      - name: Typecheck
        if: ${{ hashFiles('apps/**/tsconfig.json') != '' }}
        run: pnpm -r typecheck
      - name: Lint
        if: ${{ hashFiles('eslint.config.js', 'eslint.config.mjs', '.eslintrc.cjs') != '' }}
        run: pnpm -r lint
      - name: Build
        if: ${{ hashFiles('apps/**/package.json') != '' }}
        run: pnpm -r build
      - name: Test
        if: ${{ hashFiles('apps/**/package.json') != '' }}
        run: pnpm -r test

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
