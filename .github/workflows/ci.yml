name: ci

# CI riêng cho repo web (pnpm monorepo).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Turborepo điều phối task theo đồ thị phụ thuộc (turbo.json). Package không có script nào thì turbo bỏ qua,
      # nên không cần điều kiện hashFiles như trước. Cache cục bộ trong job; muốn cache xuyên lần chạy thì bật Remote Cache.
      - name: Typecheck, lint, test, build
        run: pnpm turbo run typecheck lint test build

  # Chặn secret lộ, lỗ hổng npm mức high, và scope @volo/ (commercial).
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Repo thuộc tài khoản cá nhân nên gitleaks-action không cần license key.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (chặn high/critical)
        run: pnpm audit --audit-level=high
      - name: Cấm npm scope @volo/
        run: |
          if grep -nE '@volo/' package.json pnpm-lock.yaml; then
            echo "::error::Phat hien scope @volo/ (commercial) trong package.json/pnpm-lock.yaml."
            exit 1
          fi

  # Kiểu TypeScript phải khớp bản OpenAPI vendored. Sửa openapi.json mà quên sinh lại -> đỏ.
  openapi-types-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Sinh lại kiểu từ openapi.json vendored
        run: pnpm generate:types
      - name: Kiểu sinh ra phải khớp bản đã commit
        run: git diff --exit-code -- packages/core-api-types
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
